name: Delete old Fiaram Pages project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-old-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fiaram-nomerika.pages.dev and its deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi
          response=$(curl -sS -w '\n%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/fiaram-nomerika")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP ${http_code}"
          echo "$body"
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 202 ] || [ "$http_code" -eq 204 ] || [ "$http_code" -eq 404 ]; then
            echo "Old Pages project removed (or already absent)."
          else
            echo "::error::Failed to delete old Pages project (HTTP ${http_code}): ${body}"
            exit 1
          fi
